/* ================================
   PAPPAN RICH SKILLS

================================ */

:root {

  --bg: #05070b;

  --bg2: #0a0f18;

  --panel: #0f1724;

  --panel2: #141e2e;

  --gold: #f4b92f;

  --gold2: #ffd86a;

  --white: #ffffff;

  --text: #e8edf5;

  --muted: #9ba8bb;

  --line: #253248;

  --green: #20d17b;

  --red: #ff5f67;

  --blue: #4e8cff;

  --shadow:
  0 20px 60px rgba(0,0,0,.35);

}


/* RESET */

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}


html {

  scroll-behavior: smooth;

}


body {

  font-family:
  Arial,
  Helvetica,
  sans-serif;

  background:
  var(--bg);

  color:
  var(--text);

  line-height: 1.6;

}


body.modal-open {

  overflow: hidden;

}


button,
input,
textarea,
select {

  font: inherit;

}


button {

  cursor: pointer;

}


a {

  color: inherit;

  text-decoration: none;

}


img {

  max-width: 100%;

  display: block;

}


.container {

  width: min(1180px,92%);

  margin: auto;

}


.gold {

  color: var(--gold);

}


.muted {

  color: var(--muted);

}


.center {

  text-align: center;

}


.hide {

  display: none !important;

}


/* ================================
   HEADER
================================ */

.site-header {

  position: sticky;

  top: 0;

  z-index: 100;

  background:
  rgba(5,7,11,.94);

  border-bottom:
  1px solid var(--line);

  backdrop-filter:
  blur(12px);

}


.nav {

  min-height: 72px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 18px;

}


.brand {

  display: flex;

  align-items: center;

  gap: 10px;

  font-weight: 900;

}


.brand-mark {

  width: 44px;

  height: 44px;

  border:
  2px solid var(--gold);

  border-radius: 50%;

  display: grid;

  place-items: center;

  color: var(--gold);

  font-size: 11px;

  box-shadow:
  0 0 24px
  rgba(244,185,47,.12);

}


.brand-text {

  font-size: 15px;

}


.nav-links {

  display: flex;

  align-items: center;

  gap: 18px;

  font-size: 14px;

  color: #d9e0eb;

}


.nav-links a:hover {

  color: var(--gold);

}


.nav-actions {

  display: flex;

  gap: 8px;

}


.mobile-menu {

  display: none;

  border:
  1px solid var(--line);

  background:
  var(--panel);

  color:
  var(--white);

  border-radius: 10px;

  padding: 8px 11px;

  font-size: 22px;

}


/* ================================
   BUTTONS
================================ */

.btn {

  border: 0;

  border-radius: 12px;

  padding: 11px 17px;

  font-weight: 800;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 7px;

  transition: .2s ease;

}


.btn:hover {

  transform:
  translateY(-1px);

}


.btn-gold {

  background:
  var(--gold);

  color:
  #111;

}


.btn-dark {

  background:
  var(--panel2);

  color:
  var(--white);

  border:
  1px solid var(--line);

}


.btn-green {

  background:
  var(--green);

  color:
  #04130c;

}


.btn-blue {

  background:
  var(--blue);

  color:
  #fff;

}


.btn-danger {

  background:
  #35171b;

  color:
  #ff9ca2;

  border:
  1px solid #633039;

}


.btn-block {

  width: 100%;

}

   HERO
================================ */

  padding:

  linear-gradient(
    145deg,

    #070a10

}

  gap: 42px;

}

  border:

  font-weight: 800;

  color:

  font-size:

}


.hero-card {

  padding: 22px;

  border-radius: 28px;

  border:

  background:

    145deg,
    #152033,
    #49380e

  box-shadow:
  var(--shadow);

}


.hero-art {

  min-height:

  border-radius:
  22px;

  display: grid;

  place-items: center;

  background:

    135deg,
    #202b3e,
    #7b5a10

  font-size:
  92px;

}


.hero-card h3 {

  margin-top:

  margin-top:
  5px;

}

.stats {

  z-index:

  gap:

  background:

  margin-bottom:

  padding:

}

  min-height:

  display:

  border-bottom:

  content:

  var(--green);

  margin-right:
  8px;

}

.offer {

  linear-gradient(
    135deg,

    #0d1522

  border-bottom:

/* ================================

================================ */

}


.dashboard-stat strong {

  display:

  margin-top:
  5px;

  font-size:

  color:
  var(--gold);

}

   STEPS
================================ */

.steps {

  counter-reset:
  step;

}


.step {

  position:
  relative;

  padding-left:
  68px;

}


.step::before {

  counter-increment:
  step;

  content:
  counter(step);

  position:
  absolute;

  left:
  0;

  top:
  0;

  width:
  48px;

  height:
  48px;

  border-radius:
  50%;

  display:
  grid;

  place-items:
  center;

  background:
  #211a08;

  border:
  1px solid #6b5319;

  color:

  font-weight:

}

  background:

}


.faq-question {

  width:
  100%;

  padding:

  border:

  left;

  800;

================================ */

.modal {

  position:
  fixed;

  inset:
  0;

  z-index:
  1000;

  display:
  none;

  align-items:
  center;

  justify-content:
  center;

  padding:
  20px;

  background:
  rgba(0,0,0,.78);

}


.modal.show {

  display:
  flex;

}


.modal-box {

  width:
  min(520px,100%);

  90vh;

  auto;

  background:
  #0c131e;

  1px solid var(--line);

  border-radius:
  22px;

  padding:
  25px;

  position:
  relative;

.modal-close {

  position:
  absolute;

  100%;
